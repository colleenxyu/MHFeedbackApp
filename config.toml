# .streamlit/config.toml

[theme]
# The primary color for interactive highlights and selected states
primaryColor = "#000000"

# The main background color (Set to your brand's bold red)
backgroundColor = "#FDFBF7"

# The sidebar and secondary container background (A deeper, darker red tone)
secondaryBackgroundColor = "#F4F4F0"

# The main text color (Set to white for crisp legibility)
textColor = "#121212"

# The font family to use
font = "sans serif, Georgia"

[client]
# Hides the automatic sidebar navigation links generated from a 'pages/' directory
showSidebarNavigation = false